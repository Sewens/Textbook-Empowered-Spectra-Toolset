<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spectra Corpus Toolset · OpenDesign Preview</title>
<style>
:root{
  --bg:oklch(97.8% .004 250);

*{box-sizing:border-box}

body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.app-shell{height:100vh;display:grid;grid-template-rows:74px 58px minmax(0,1fr) 24px;background:var(--bg)}
.banner{display:flex;align-items:center;gap:22px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border-strong)}
.brand{display:flex;align-items:center;gap:12px;min-width:300px}.mark{width:30px;height:30px;border:2px solid var(--accent);border-left-color:transparent;border-radius:50%;position:relative;flex:0 0 auto}.mark:after{content:"";position:absolute;inset:7px;background:var(--accent);border-radius:50%}.brand strong{display:block;font:600 20px/1.05 var(--font-display);letter-spacing:-.02em}.brand small{display:block;margin-top:5px;color:var(--muted);font-size:12px;letter-spacing:.01em}.banner-copy{min-width:0;max-width:820px;color:var(--muted);font-size:13px}.banner-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}.lang-switch{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--border-strong);background:var(--panel);border-radius:var(--radius);overflow:hidden}.lang-switch button{width:42px;height:30px;border:0;background:transparent;color:var(--muted);font:600 11px/1 var(--font-mono);letter-spacing:.08em}.lang-switch button.active{background:var(--surface);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}.account-popover{width:260px;display:grid;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--border-strong)}.account-popover p{margin:0;color:var(--muted);font-size:12px}.field-label{font:600 11px/1 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tool-tabs{display:flex;align-items:end;gap:5px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--border-strong);overflow-x:auto}.tool-tab{min-width:156px;height:47px;display:grid;align-content:center;gap:2px;border:1px solid transparent;border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;background:transparent;padding:0 14px;text-align:left;color:var(--muted);white-space:nowrap}.tool-tab span{font-weight:620;letter-spacing:-.01em}.tool-tab small{font-size:11px;letter-spacing:.01em}.tool-tab.active{height:53px;background:var(--surface);color:var(--fg);border-color:var(--border-strong);box-shadow:inset 0 3px 0 var(--accent)}
#main_frame{min-height:0;display:grid;grid-template-rows:54px minmax(0,1fr);background:var(--surface)}.frame-head{display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface)}.frame-title{min-width:280px}.frame-title strong{display:block;font:600 15px/1 var(--font-display);letter-spacing:-.01em}.frame-title span{display:block;margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.01em}.frame-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.frame-body{min-height:0;overflow:auto;padding:18px;background:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px),var(--surface);background-size:32px 32px}.footer{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:1px solid var(--border);background:var(--panel);color:var(--muted);font:11px/1 var(--font-mono)}
.page-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:16px;min-height:100%}.groups-layout{grid-template-columns:minmax(420px,.85fr) minmax(0,1.15fr)}.spectra-layout{grid-template-columns:minmax(0,1fr) 370px}.graph-layout{grid-template-columns:minmax(0,1fr) 390px}.curation-layout{grid-template-columns:minmax(0,1fr) 380px}.panel{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);min-width:0;box-shadow:0 1px 0 color-mix(in oklch,var(--fg) 6%,transparent)}.full-panel{min-height:100%}.panel-head{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel)}.panel-head h2{margin:0;font:600 13px/1 var(--font-display);letter-spacing:-.01em}.panel-head small{color:var(--muted);font:11px/1 var(--font-mono)}.panel-body{padding:14px}.panel-body.flush{padding:0}.detail-scroll{max-height:calc(100vh - 210px);overflow:auto}.group-index-panel,.group-detail-panel{min-height:100%}
.metric-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px}.metric-row.compact{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{border:1px solid var(--border);background:var(--bg);padding:12px}.metric strong{display:block;font:600 21px/1 var(--font-mono);letter-spacing:-.02em}.metric span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.state-panel{border:1px solid var(--border-strong);background:var(--surface);padding:28px;max-width:620px}.state-panel h2{margin:0 0 8px;font:600 22px/1.1 var(--font-display)}.state-panel p{margin:0;color:var(--muted)}.inline-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tag-list{display:flex;gap:4px;flex-wrap:wrap}.chip-row{display:flex;gap:6px;flex-wrap:wrap}.chip-row span{border:1px solid var(--border);background:var(--panel);padding:3px 7px;font:11px/1 var(--font-mono)}
.spectrum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.spectrum-card{border:1px solid var(--border);background:var(--bg);padding:10px}.spectrum-card img,.asset-preview img{width:100%;height:190px;object-fit:contain;background:white;border:1px solid var(--border)}.spectrum-card h3{margin:8px 0 3px;font:600 13px/1.2 var(--font-display)}.spectrum-card p{margin:0 0 8px;color:var(--muted);font-size:12px}.image-empty,.asset-preview{height:190px;display:grid;place-items:center;border:1px solid var(--border);background:var(--panel);color:var(--muted);font:12px/1 var(--font-mono)}.asset-preview{height:260px;margin-bottom:12px}.asset-preview img{height:260px}.curation-steps{margin:18px 0}.active-row td{background:var(--accent-soft)!important}.ant-table-row{cursor:pointer}.ant-table-wrapper .ant-table-thead>tr>th{font:600 11px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.markdown-lite{display:grid;gap:8px;color:#374151;line-height:1.65}.markdown-lite.compact{gap:5px;font-size:12px}.markdown-lite p{margin:0;white-space:pre-wrap}.markdown-lite figure{margin:0;display:grid;gap:5px}.markdown-lite img{max-width:100%;max-height:210px;object-fit:contain;border:1px solid var(--border);background:white}.markdown-lite figcaption{color:var(--muted);font-size:11px}.md-table-wrap{max-width:100%;overflow:auto;border:1px solid var(--border);background:white}.md-table-wrap table{width:100%;border-collapse:collapse;font-size:12px}.md-table-wrap th,.md-table-wrap td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.md-table-wrap th{background:var(--panel);font-weight:600}
@media (max-width:980px){body{overflow:auto}.app-shell{min-height:100vh;height:auto;grid-template-rows:auto auto minmax(0,1fr) auto}.banner{align-items:flex-start;flex-wrap:wrap;padding:14px}.banner-copy{order:3;flex-basis:100%;max-width:none}.banner-actions{margin-left:0}.tool-tabs{padding:0 14px}.tool-tab{min-width:140px}.frame-head{height:auto;min-height:58px;flex-wrap:wrap;padding:10px 14px}.frame-title{min-width:100%}.frame-body{padding:14px}.page-grid,.groups-layout,.spectra-layout,.graph-layout,.curation-layout{grid-template-columns:1fr}.metric-row,.metric-row.compact,.spectrum-grid{grid-template-columns:1fr 1fr}.detail-scroll{max-height:none}}
@media (max-width:560px){.brand{min-width:0}.brand strong{font-size:17px}.banner-actions{width:100%;justify-content:space-between}.tool-tab{min-width:128px}.metric-row,.metric-row.compact,.spectrum-grid{grid-template-columns:1fr}.frame-actions{width:100%;margin-left:0}}

.role-select,.search-input{height:32px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius);padding:0 9px;color:var(--fg)}
.search-input{width:min(360px,100%)}.endpoint-btn,.primary-btn{height:32px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);padding:0 12px}.primary-btn{border-color:var(--accent);background:var(--accent);color:white;font-weight:560}
.table-wrap{overflow:auto;border-top:1px solid var(--border)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:var(--panel);font:600 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}tbody tr{cursor:pointer}tbody tr:hover,tr.active{background:var(--accent-soft)}
.tabs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--border)}.tab{height:34px;border:1px solid transparent;border-bottom:0;background:transparent;padding:0 12px;color:var(--muted)}.tab.active{background:var(--surface);border-color:var(--border-strong);box-shadow:inset 0 2px 0 var(--accent);color:var(--fg)}.tab-panel{padding-top:12px}
.chart-box{height:230px;border:1px solid var(--border);background:repeating-linear-gradient(to right,transparent 0 29px,var(--border) 30px),linear-gradient(var(--surface),var(--bg));position:relative;overflow:hidden;margin:12px 0}.chart-bars{position:absolute;inset:24px 16px 40px;display:flex;align-items:end;gap:6px}.chart-bars i{flex:1;min-width:10px;background:var(--accent);opacity:.82}.chart-axis{position:absolute;left:16px;right:16px;bottom:28px;height:1px;background:var(--border-strong)}
.notice{border:1px solid color-mix(in oklch,var(--accent) 35%,var(--border));background:var(--accent-soft);padding:12px;color:var(--fg)}.steps{display:grid;gap:10px;margin-top:14px}.step{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border);background:var(--bg);padding:10px}.step b{font:600 12px/1 var(--font-mono)}.status-chip.forbidden .status-dot{background:var(--danger)}
.graph-canvas{height:600px;border:1px solid var(--border);background:radial-gradient(circle at 30% 40%,var(--accent-soft),transparent 28%),var(--bg);position:relative;overflow:hidden}.node{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 18%,transparent)}
</style>

<body>
<div class="app-shell">
<header class="banner"><a class="brand" href="#groups"><span class="mark"></span><span><strong>Spectra Corpus Toolset</strong><small>IR-IE v0.7 谱学语料库与工具集</small></span></a><p class="banner-copy" id="bannerCopy">面向材料科学家的谱学知识工作台：顶部只保留账户与语言，工具切换集中在路由 tab，当前工具在 main_frame 中展开。</p><div class="banner-actions"><div class="lang-switch"><button data-lang="zh" class="active">中</button><button data-lang="en">EN</button></div><select class="role-select" id="roleSelect"><option value="ordinary_user">普通用户</option><option value="data_admin">数据管理员</option><option value="site_admin">网站管理员</option></select><button class="account-btn"><span class="avatar">U</span><span id="accountLabel">普通用户</span></button><button class="endpoint-btn" id="endpointBtn">GET /groups</button></div></header>
<nav class="tool-tabs" id="toolTabs"></nav>
<main id="main_frame"><div class="frame-head"><div class="frame-title"><strong id="frameTitle">基团卡片</strong><span id="frameSub">GET /groups</span></div><div class="frame-actions"><span class="status-chip" id="permissionChip"><span class="status-dot"></span><span id="permissionText">schema v0.7</span></span><span class="status-chip"><span id="roleChip">ordinary_user</span></span></div></div><section class="frame-body" id="frameBody"></section></main>
<footer class="footer"><span>IR-IE v0.7 · JupyterLab-style workbench · OpenDesign preview</span><span id="routeFoot">GET /groups</span></footer>
</div>
<script>
const API='http://127.0.0.1:8001/api', qs=(s,r=document)=>r.querySelector(s), qsa=(s,r=document)=>Array.from(r.querySelectorAll(s));
let activeRoute='groups', lang='zh', role=localStorage.getItem('spectra.preview.role')||'ordinary_user', selectedGroup='', detailTab='spectra';
const roleLabels={ordinary_user:'普通用户',data_admin:'数据管理员',site_admin:'网站管理员'};
const perms={ordinary_user:['project:read','group:read','compound:read','spectrum:read','evidence:read'],data_admin:['project:read','group:read','compound:read','spectrum:read','evidence:read','analysis:create'],site_admin:['project:read','group:read','compound:read','spectrum:read','evidence:read','analysis:create','user:manage']};
const routes=[['groups','基团卡片','Group Cards','FG_*.json 目录','FG_*.json index','GET /groups','group:read'],['spectra','谱图查看','Spectra','峰位与归属','peaks and assignments','GET /spectra','spectrum:read'],['search','波数检索','Wavenumber Search','模板与实测峰','templates and peaks','GET /wavenumber','spectrum:read'],['compounds','化合物实例','Compounds','去重 compound','deduplicated compounds','GET /compounds','compound:read'],['graph','知识图谱','Graph','节点与边','nodes and edges','GET /graph','group:read'],['evidence','证据追踪','Evidence','source claims','source claims','GET /groups/{id}','evidence:read'],['curation','标注流转','Curation','RBAC 预留','RBAC ready','POST /analysis','analysis:create']].map(x=>({key:x[0],title:{zh:x[1],en:x[2]},hint:{zh:x[3],en:x[4]},endpoint:x[5],permission:x[6]}));
const sample={manifest:{stats:{functional_groups:37,evidence_spans:606,spectra:97,peaks:196}},groups:[{group_id:'FG_CARBONYL',name_zh:'羰基',name_en:'Carbonyl',vibration_count:8,peak_count:15,evidence_count:30,chemical_formula:'C=O',smarts:'C=O'},{group_id:'FG_HYDROXYL',name_zh:'羟基',name_en:'Hydroxyl',vibration_count:11,peak_count:8,evidence_count:21,chemical_formula:'OH',smarts:'[OX2H]'}],compounds:[{compound_id:'CMPD_ACETONE',name_zh:'丙酮',name_en:'Acetone',molecular_formula:'C3H6O',compound_class:'ketone',group_ids:['FG_CARBONYL'],spectrum_count:1,peak_count:3}],spectra:[{spectrum_id:'SPEC_ACETONE_IR',compound_name_zh:'丙酮',group_name_zh:'羰基',group_id:'FG_CARBONYL',figure_caption:'Acetone carbonyl spectrum',annotated_peak_count:3}],graph:{nodes:[{label:'羰基',type:'group'},{label:'丙酮',type:'compound'},{label:'spectrum',type:'spectrum'}],edges:[1]}};
const state={manifest:null,groups:null,group:null,compounds:null,spectra:null,graph:null,search:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function r(){return routes.find(x=>x.key===activeRoute)||routes[0]} function ok(p){return !p||perms[role].includes(p)} function L(o){return o[lang]}
async function getJson(path,fallback){try{let res=await fetch(API+path,{headers:{'X-User-Role':role}}); if(!res.ok) throw Error(res.status); return await res.json()}catch(e){console.warn('OpenDesign preview fallback',path,e); return fallback}}
function chrome(){let x=r();qs('#frameTitle').textContent=L(x.title);qs('#frameSub').textContent=x.endpoint;qs('#routeFoot').textContent=x.endpoint;qs('#endpointBtn').textContent=x.endpoint;qs('#roleChip').textContent=role;qs('#accountLabel').textContent=roleLabels[role];qs('#permissionText').textContent=ok(x.permission)?'schema v0.7':'forbidden · '+x.permission;qs('#permissionChip').classList.toggle('forbidden',!ok(x.permission));}
function tabs(){qs('#toolTabs').innerHTML=routes.map(x=>`<button class="tool-tab ${x.key===activeRoute?'active':''}" data-route="${x.key}"><span>${L(x.title)}</span><small>${L(x.hint)}</small></button>`).join('');qsa('[data-route]').forEach(b=>b.onclick=()=>{activeRoute=b.dataset.route;location.hash=activeRoute;render()})}
async function ensure(){if(!state.manifest)state.manifest=await getJson('/manifest',sample.manifest); if(!state.groups){let g=await getJson('/groups',{items:sample.groups});state.groups=g.items||sample.groups;selectedGroup=selectedGroup||state.groups[0]?.group_id;state.group=await getJson('/groups/'+selectedGroup,{...sample.groups[0],spectral_gallery:sample.spectra,vibration_templates:[],evidence_spans:[],source_claims:[]})} if(activeRoute==='spectra'&&!state.spectra){let x=await getJson('/spectra',{items:sample.spectra});state.spectra=x.items||sample.spectra} if(activeRoute==='compounds'&&!state.compounds){let x=await getJson('/compounds',{items:sample.compounds});state.compounds=x.items||sample.compounds} if(activeRoute==='graph'&&!state.graph)state.graph=await getJson('/graph',sample.graph)}
function metrics(){let s=(state.manifest||sample.manifest).stats;return `<div class="metric-row"><div class="metric"><strong>${s.functional_groups}</strong><span>基团卡片</span></div><div class="metric"><strong>${s.evidence_spans}</strong><span>证据片段</span></div><div class="metric"><strong>${s.spectra}</strong><span>谱图记录</span></div><div class="metric"><strong>${s.peaks}</strong><span>峰归属</span></div></div>`}
function groupTab(g){let a=g.spectral_gallery||[],v=g.vibration_templates||[],e=g.evidence_spans||[],c=g.source_claims||[]; if(detailTab==='spectra')return `<div class="spectrum-grid">${(a.length?a:sample.spectra).slice(0,4).map(x=>`<article class="spectrum-card"><div class="image-empty">text evidence</div><h3>${esc(x.compound_name_zh||x.compound_id||x.spectrum_id)}</h3><p>${esc(x.figure_caption||'')}</p><div class="chip-row"><span>${esc(x.spectrum_id||'spectrum')}</span><span>${(x.annotated_peaks||[]).length||x.annotated_peak_count||0} peaks</span></div></article>`).join('')}</div>`; if(detailTab==='vibrations')return table(['ID','模式','描述'],v.slice(0,12).map(x=>[x.vibration_id,x.mode,x.textbook_description])); if(detailTab==='evidence')return table(['Evidence ID','来源','文本'],e.slice(0,12).map(x=>[x.evidence_id,x.source_book,x.text||x.evidence_text||x.quote])); return table(['Claim ID','谓词','对象'],c.slice(0,12).map(x=>[x.claim_id,x.predicate,JSON.stringify(x.object||{})]))}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function groups(){let g=state.group||{}, rows=state.groups||sample.groups;qs('#frameBody').innerHTML=`<div class="page-grid groups-layout"><section class="panel"><div class="panel-head"><h2>功能基团卡片</h2><input class="search-input" placeholder="搜索 group id / 中英文名 / SMARTS"></div><div class="panel-body flush">${metrics()}${table(['中文名','英文名','模板','峰','证据'],rows.map(x=>[x.name_zh,x.name_en,x.vibration_count,x.peak_count,x.evidence_count]))}</div></section><section class="panel"><div class="panel-head"><h2>${esc(g.name_zh||selectedGroup)}</h2><small>${esc(g.schema_version||'schema v0.7')}</small></div><div class="panel-body detail-scroll"><table><tbody><tr><th>Group ID</th><td>${esc(g.group_id)}</td><th>English</th><td>${esc(g.name_en)}</td></tr><tr><th>Formula</th><td>${esc(g.chemical_formula||g.group?.formula_fragment)}</td><th>SMARTS</th><td>${esc(g.smarts)}</td></tr></tbody></table><div class="chart-box"><div class="chart-bars">${rows.slice(0,14).map(x=>`<i style="height:${Math.max(8,Math.min(100,x.peak_count*6))}%"></i>`).join('')}</div><div class="chart-axis"></div></div><div class="tabs"><button class="tab ${detailTab==='spectra'?'active':''}" data-detail="spectra">谱图/实例</button><button class="tab ${detailTab==='vibrations'?'active':''}" data-detail="vibrations">振动模板</button><button class="tab ${detailTab==='evidence'?'active':''}" data-detail="evidence">证据片段</button><button class="tab ${detailTab==='claims'?'active':''}" data-detail="claims">来源声明</button></div><div class="tab-panel">${groupTab(g)}</div></div></section></div>`;qsa('[data-detail]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detail;groups()})}
function spectra(){let rows=state.spectra||sample.spectra,x=rows[0]||{};qs('#frameBody').innerHTML=`<div class="page-grid spectra-layout"><section class="panel"><div class="panel-head"><h2>谱图索引</h2><small>${rows.length} spectra</small></div><div class="panel-body flush">${table(['谱图','化合物','基团','峰'],rows.map(r=>[r.spectrum_id,r.compound_name_zh||r.compound_id,r.group_name_zh,r.annotated_peak_count]))}</div></section><aside class="panel"><div class="panel-head"><h2>快速预览</h2><small>${esc(x.spectrum_id)}</small></div><div class="panel-body"><div class="asset-preview">文本/表格证据</div><h3>${esc(x.compound_name_zh||x.compound_id)}</h3><p>${esc(x.figure_caption)}</p></div></aside></div>`}
function search(){let rows=state.search;qs('#frameBody').innerHTML=`<div class="panel"><div class="panel-head"><h2>波数检索</h2><div class="inline-actions"><input class="search-input" id="wn" value="1715" style="width:120px"><input class="search-input" id="tol" value="10" style="width:90px"><button class="primary-btn" id="runSearch">检索</button></div></div><div class="panel-body flush">${table(['基团','峰位','距离','归属','来源'],rows.map(r=>[r.group_name_zh,Array.isArray(r.wavenumber)?r.wavenumber.join('-'):r.wavenumber,r.distance,r.assignment,r.source_book]))}</div></div>`;qs('#runSearch').onclick=async()=>{let r=await getJson('/wavenumber?value='+qs('#wn').value+'&tolerance='+qs('#tol').value,{items:[]});state.search=r.items||[];search()}}
function compounds(){let rows=state.compounds||sample.compounds;qs('#frameBody').innerHTML=`<div class="panel"><div class="panel-head"><h2>化合物实例索引</h2><small>${rows.length} compounds</small></div><div class="panel-body flush">${table(['中文名','English','分子式','类别','关联基团','谱图','峰'],rows.map(r=>[r.name_zh,r.name_en,r.molecular_formula,r.compound_class,(r.group_ids||[]).join(', '),r.spectrum_count,r.peak_count]))}</div></div>`}
function graph(){let g=state.graph||sample.graph;qs('#frameBody').innerHTML=`<div class="page-grid graph-layout"><section class="panel"><div class="panel-head"><h2>知识图谱</h2><small>${g.nodes.length} nodes · ${g.edges.length} edges</small></div><div class="panel-body"><div class="graph-canvas">${g.nodes.slice(0,80).map((n,i)=>`<span class="node" title="${esc(n.label)}" style="left:${8+(i*37)%84}%;top:${12+(i*53)%76}%"></span>`).join('')}</div></div></section><aside class="panel"><div class="panel-head"><h2>节点抽样</h2><small>top 80</small></div><div class="panel-body flush">${table(['类型','Label'],g.nodes.slice(0,80).map(n=>[n.type,n.label]))}</div></aside></div>`}
function evidence(){let rows=(state.group?.evidence_spans||[]).slice(0,80);qs('#frameBody').innerHTML=`<div class="panel"><div class="panel-head"><h2>证据追踪</h2><small>sample from selected group · 后续可接 /api/evidence</small></div><div class="panel-body flush">${table(['Evidence ID','来源','文本'],rows.map(e=>[e.evidence_id,e.source_book,e.text||e.evidence_text||e.quote]))}</div></div>`}
function curation(){qs('#frameBody').innerHTML=`<div class="page-grid curation-layout"><section class="panel"><div class="panel-head"><h2>标注流转 / RBAC 准备</h2><button class="primary-btn" id="submitAnalysis">以当前角色提交分析任务</button></div><div class="panel-body"><div class="notice">后端 RBAC 已接入：普通用户会被 POST /analysis 拒绝；数据管理员和网站管理员可提交。</div><div class="steps"><div class="step"><b>01</b><span>Import FG_*.json<br><small>raw_data/basic_groups_v07_20260619</small></span><span class="state">done</span></div><div class="step"><b>02</b><span>Normalize entities<br><small>cards / spectra / peaks / assignments</small></span><span class="state">active</span></div><div class="step"><b>03</b><span>Join evidence links<br><small>evidence_ids -> evidence_spans</small></span><span class="state">active</span></div></div><p id="submitResult"></p></div></section><aside class="panel"><div class="panel-head"><h2>权限边界</h2><small>${role}</small></div><div class="panel-body"><div class="chip-row">${perms[role].map(p=>`<span>${p}</span>`).join('')}</div></div></aside></div>`}
async function render(){if(location.hash&&routes.some(x=>x.key===location.hash.slice(1)))activeRoute=location.hash.slice(1);tabs();chrome();if(!ok(r().permission)){qs('#frameBody').innerHTML='<div class="state-panel"><h2>当前角色无权访问</h2><p>请选择数据管理员或网站管理员，或等待后续正式登录系统接入。</p></div>';return}await ensure();({groups,spectra,search,compounds,graph,evidence,curation}[activeRoute])()}
qsa('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang==='zh'?'zh-CN':'en';qsa('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));qs('#bannerCopy').textContent=lang==='zh'?'面向材料科学家的谱学知识工作台：顶部只保留账户与语言，工具切换集中在路由 tab，当前工具在 main_frame 中展开。':'A spectroscopy knowledge workbench: account and language stay in the banner, routes live in top tabs, and the active tool opens inside main_frame.';render()});qs('#roleSelect').value=role;qs('#roleSelect').onchange=e=>{role=e.target.value;localStorage.setItem('spectra.preview.role',role);render()};window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
